name: Daily pre-market intelligence
on:
  schedule:
    - cron: '30 20 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - name: Refresh licensed broker consensus (when configured)
        env:
          BROKER_CONSENSUS_URL: ${{ secrets.BROKER_CONSENSUS_URL }}
          BROKER_CONSENSUS_TOKEN: ${{ secrets.BROKER_CONSENSUS_TOKEN }}
        run: python update_brokers.py
      - name: Publish snapshot
        run: |
          git config user.name market-intelligence-bot
          git config user.email actions@users.noreply.github.com
          git add daily.json broker_consensus.json
          git diff --cached --quiet || (git commit -m 'Update daily market intelligence' && git push)
