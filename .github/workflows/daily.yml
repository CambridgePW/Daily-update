name: Daily pre-market intelligence
on:
  push:
    branches: [main]
    paths:
      - 'update.py'
      - 'allocation_history.py'
      - 'gold_backtest.py'
      - 'index.html'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '30 20 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - name: Recalculate historical allocation illustration
        run: python allocation_history.py
      - name: Backtest gold overlay scenarios
        run: python gold_backtest.py
      - name: Refresh licensed broker consensus (when configured)
        env:
          BROKER_CONSENSUS_URL: ${{ secrets.BROKER_CONSENSUS_URL }}
          BROKER_CONSENSUS_TOKEN: ${{ secrets.BROKER_CONSENSUS_TOKEN }}
        run: python update_brokers.py
      - name: Publish snapshot
        run: |
          git config user.name market-intelligence-bot
          git config user.email actions@users.noreply.github.com
          git add daily.json broker_consensus.json allocation_history.json gold_backtest.json
          git diff --cached --quiet || (git commit -m 'Update daily market intelligence' && git push)
